<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTMl</title>
</head>
<body>
    <h1>
        Tags em HTML
    </h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.
    </p>
    <ul>
        <li><ins><tag title="Use a tag <p>">Parágrafo</tag></ins></li>
        <li><ins><tag title="Use as tags <h1>...<h6>">Títulos</tag></ins></li>
        <li><ins><tag title="Use a tag <img>">Imagens</tag></ins></li>
        <li><ins><tag title="Use a tag <abbr>">Abreviações</tag></ins></li>
        <li><ins><tag title="Use a tag <code>">Códigos Fontes</tag></ins></li>
        <li><ins><tag title="Use as tags <ol> e <il>">Listas numeradas</tag></ins></li>
        <li><ins><tag title="Use as tags <ul> e <li>">Listas com demarcadores</tag></ins></li>
    </ul>
</body>
</html>
